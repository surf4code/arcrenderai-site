<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcRender AI — Deterministic 2.5D Video Engine</title>
  <meta name="description" content="ArcRender AI compiles scripts and audio tracks into 2.5D Three.js dioramas, inked vector character rigs, and stitched MP4 episodes using distributed Linux workers." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --surface-alt: #f0eee7;
      --ink: #141413;
      --muted: #5a5955;
      --subtle: #888680;
      --border: #e2dfd7;
      --border-strong: #ccc8be;
      --accent: #c8461d;
      --accent-hover: #a83714;
      --accent-soft: #faeae4;
      --ok: #157347;
      --ok-soft: #e6f4ec;
      --code-bg: #161615;
      --code-ink: #e8e6df;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .display {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      letter-spacing: -0.025em;
    }

    code, pre, .mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

    /* Scroll Reveal Motion */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.65s var(--ease-out), transform 0.65s var(--ease-out);
    }
    .reveal.in { opacity: 1; transform: translateY(0); }

    /* Top Bar */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(247, 246, 242, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; gap: 20px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.06rem;
    }
    .brand-mark {
      width: 26px; height: 26px; background: var(--ink); color: #fff;
      display: grid; place-items: center; border-radius: 5px;
      font-size: 0.76rem; font-weight: 700; letter-spacing: 0;
    }
    .nav { display: flex; align-items: center; gap: 26px; }
    .nav a { font-size: 0.88rem; font-weight: 500; color: var(--muted); transition: color 0.15s; }
    .nav a:hover { color: var(--ink); }
    .nav-actions { display: flex; align-items: center; gap: 10px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 16px; border-radius: 7px; font-size: 0.87rem; font-weight: 600;
      border: 1px solid transparent;
      transition: transform 0.12s var(--ease-out), background 0.15s, border-color 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: #2c2c29; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-outline { background: var(--surface); color: var(--ink); border-color: var(--border-strong); }
    .btn-outline:hover { background: var(--surface-alt); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

    /* Hero */
    .hero { padding: 56px 0 42px; }
    .hero-top {
      display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px;
      align-items: end; margin-bottom: 36px;
    }
    .release-pill {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.78rem; font-weight: 500; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
      padding: 5px 11px; border-radius: 6px; margin-bottom: 16px;
    }
    .release-pill .ver { color: var(--accent); font-weight: 600; }
    .hero h1 {
      font-size: clamp(2.25rem, 4.3vw, 3.6rem);
      line-height: 1.05; font-weight: 700; color: var(--ink);
    }
    .hero-right p { font-size: 1rem; color: var(--muted); margin-bottom: 18px; }
    .access-form { display: flex; gap: 8px; }
    .access-form input {
      flex: 1; padding: 10px 13px; border-radius: 7px;
      border: 1px solid var(--border-strong); background: var(--surface);
      font-size: 0.9rem; color: var(--ink); outline: none;
      transition: border-color 0.15s;
    }
    .access-form input:focus { border-color: var(--ink); }
    .form-note { font-size: 0.78rem; color: var(--subtle); margin-top: 8px; }
    .form-success {
      display: none; margin-top: 10px; font-size: 0.84rem; font-weight: 500;
      color: var(--ok); background: var(--ok-soft); padding: 8px 12px; border-radius: 6px;
    }

    /* Interactive Studio Workbench */
    .workbench {
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 24px 55px -28px rgba(20, 20, 19, 0.22);
    }
    .wb-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: var(--surface-alt);
      border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px;
    }
    .wb-title { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); }
    .wb-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
      box-shadow: 0 0 0 3px rgba(21, 115, 71, 0.18);
    }
    .wb-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .seg-group {
      display: inline-flex; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 2px;
    }
    .seg-btn {
      border: none; background: transparent; padding: 4px 10px; border-radius: 4px;
      font-size: 0.76rem; font-weight: 600; color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }
    .seg-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

    .wb-grid {
      display: grid; grid-template-columns: 235px 1fr 270px;
      min-height: 410px;
    }
    .wb-left {
      border-right: 1px solid var(--border); padding: 14px; background: #fbfaf7;
      display: flex; flex-direction: column; gap: 6px;
    }
    .wb-label {
      font-size: 0.69rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--subtle); font-weight: 600; margin-bottom: 6px;
    }
    .scene-item {
      text-align: left; width: 100%; background: transparent; border: 1px solid transparent;
      padding: 9px 10px; border-radius: 7px; transition: all 0.14s var(--ease-out);
      position: relative;
    }
    .scene-item:hover { background: var(--surface-alt); }
    .scene-item.active {
      background: var(--surface); border-color: var(--border-strong);
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }
    .scene-item.active::before {
      content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
      background: var(--accent); border-radius: 0 3px 3px 0;
    }
    .scene-item .s-name { display: block; font-size: 0.81rem; font-weight: 600; color: var(--ink); }
    .scene-item .s-meta { display: block; font-size: 0.72rem; color: var(--subtle); margin-top: 2px; }

    .wb-center {
      background: #171715; padding: 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
    }
    .canvas-shell {
      width: 100%; max-width: 600px; aspect-ratio: 16 / 9;
      background: #111; border-radius: 7px; overflow: hidden;
      border: 1px solid #30302c; position: relative;
      transition: max-width 0.3s var(--ease-out), aspect-ratio 0.3s var(--ease-out);
      cursor: crosshair;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }
    .canvas-shell.vertical { max-width: 230px; aspect-ratio: 9 / 16; }
    canvas#stageCanvas { width: 100%; height: 100%; display: block; }
    .hud-overlay {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; pointer-events: none;
      font-size: 0.67rem;
    }
    .hud-chip {
      background: rgba(20, 20, 19, 0.78); color: #f5f3ec;
      border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(4px);
      padding: 3px 8px; border-radius: 4px; font-weight: 500;
    }
    .orbit-hint {
      position: absolute; bottom: 52px; right: 10px; pointer-events: none;
      font-size: 0.64rem; color: rgba(255,255,255,0.68);
      background: rgba(20,20,19,0.55); padding: 2px 7px; border-radius: 4px;
    }
    .caption-bar {
      position: absolute; bottom: 13px; left: 50%; transform: translateX(-50%);
      background: rgba(16, 16, 15, 0.92); color: #ffffff;
      padding: 5px 12px; border-radius: 5px;
      font-size: 0.79rem; font-weight: 700; letter-spacing: 0.01em;
      white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .caption-bar .hi { color: #facc15; }

    .wb-right {
      border-left: 1px solid var(--border); padding: 14px; background: #fbfaf7;
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    }
    .prop-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.79rem;
    }
    .prop-row span:first-child { color: var(--muted); }
    .prop-row span:last-child { font-weight: 600; color: var(--ink); }
    .worker-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 8px;
    }
    .worker-cell {
      height: 14px; border-radius: 3px; background: var(--border);
      transition: background 0.18s, transform 0.18s;
    }
    .worker-cell.busy { background: var(--accent); transform: scaleY(0.85); }
    .worker-cell.done { background: var(--ok); transform: scaleY(1); }

    /* Multi-Track NLE Timeline */
    .wb-timeline {
      border-top: 1px solid var(--border); background: var(--surface);
      padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .tl-head {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.74rem; color: var(--muted);
    }
    .tl-lanes {
      position: relative; background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 10px; cursor: pointer;
      display: flex; flex-direction: column; gap: 6px; overflow: hidden;
    }
    .tl-lane {
      display: flex; align-items: center; gap: 10px; height: 18px; position: relative;
    }
    .tl-tag {
      width: 58px; font-size: 0.66rem; font-weight: 600; color: var(--subtle); flex-shrink: 0;
    }
    .tl-strip {
      flex: 1; height: 100%; background: rgba(20,20,19,0.04); border-radius: 3px;
      position: relative; display: flex; align-items: center; padding: 0 4px; gap: 2px;
    }
    .kf-diamond {
      position: absolute; top: 50%; width: 7px; height: 7px;
      background: var(--subtle); transform: translate(-50%, -50%) rotate(45deg);
      transition: background 0.15s, transform 0.15s;
    }
    .kf-diamond.hit { background: var(--accent); transform: translate(-50%, -50%) rotate(45deg) scale(1.3); }
    .wave-bar { flex: 1; background: #9c988e; border-radius: 1.5px; transition: background 0.08s; }
    .wave-bar.hot { background: var(--accent); }
    .playhead {
      position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent);
      left: 68px; pointer-events: none; z-index: 4;
    }
    .playhead::before {
      content: ""; position: absolute; top: 0; left: -4px;
      border-left: 5px solid transparent; border-right: 5px solid transparent;
      border-top: 6px solid var(--accent);
    }

    /* Sections */
    section { padding: 76px 0; border-top: 1px solid var(--border); }
    .sec-head {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 24px; margin-bottom: 38px; flex-wrap: wrap;
    }
    .sec-kicker {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--accent); font-weight: 600; margin-bottom: 8px; display: block;
    }
    .sec-head h2 { font-size: clamp(1.7rem, 3vw, 2.35rem); line-height: 1.15; max-width: 560px; }
    .sec-head p { color: var(--muted); max-width: 440px; font-size: 0.95rem; }

    /* Pipeline Grid */
    .pipe-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .pipe-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.25s var(--ease-out), border-color 0.2s, box-shadow 0.25s;
    }
    .pipe-card:hover {
      transform: translateY(-3px); border-color: var(--border-strong);
      box-shadow: 0 12px 24px -18px rgba(20,20,19,0.22);
    }
    .pipe-num { font-size: 0.74rem; font-weight: 600; color: var(--subtle); margin-bottom: 14px; }
    .pipe-card h3 { font-size: 1.05rem; margin-bottom: 8px; }
    .pipe-card p { font-size: 0.87rem; color: var(--muted); }
    .pipe-tag {
      margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border);
      font-size: 0.75rem; color: var(--ink); font-weight: 500;
    }

    /* Benchmarks + Calculator */
    .bench-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 24px; align-items: start; }
    .table-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
    th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--border); }
    th {
      background: var(--surface-alt); font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--muted); font-weight: 600;
    }
    tr:last-child td { border-bottom: none; }
    .hl { color: var(--ok); font-weight: 600; }

    .calc-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 24px;
    }
    .calc-card h3 { font-size: 1.1rem; margin-bottom: 4px; }
    .calc-card .sub { font-size: 0.84rem; color: var(--muted); margin-bottom: 20px; }
    .range-wrap { margin-bottom: 18px; }
    .range-top { display: flex; justify-content: space-between; font-size: 0.84rem; margin-bottom: 8px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .calc-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border);
    }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }

</html>
